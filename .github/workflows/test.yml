name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 22 is the floor: better-sqlite3 13 declares engines >=22, and MSP's
        # own package.json now matches. Node 24 is in: the better-sqlite3 11
        # teardown abort that kept it out is gone at 13.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Contract + integration, then the vault-isolation security proofs.
      - run: npm test
      # The publishable client must stay packable; it is the one artifact that
      # leaves this repo.
      - run: npm run pack:client
